[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.1",
    "langchain-core>=0.2",
    "pydantic>=2.5",
    "pydantic-settings>=2.3",
    "redis[asyncio]>=5.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "langfuse>=2.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "structlog>=24.1",
    "mcp>=0.9",
    "httpx>=0.27",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.9",
    "ruff>=0.4",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "factory-boy>=3.3",
    "fakeredis>=2.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
]
