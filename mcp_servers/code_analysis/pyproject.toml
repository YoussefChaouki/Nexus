[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-mcp-code-analysis"
version = "0.1.0"
description = "Code/config analysis MCP server for the NEXUS multi-agent threat analysis pipeline"
requires-python = ">=3.11"
dependencies = [
    "mcp>=0.9",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.9",
    "ruff>=0.4",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "types-PyYAML>=6.0",
]

[project.scripts]
nexus-mcp-code-analysis = "server:main"

[tool.setuptools]
py-modules = ["server", "dependency_scanner", "pattern_detector", "attack_surface", "schemas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
