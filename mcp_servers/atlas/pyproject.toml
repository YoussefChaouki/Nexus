[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-mcp-atlas"
version = "0.1.0"
description = "MITRE ATLAS MCP server with in-memory vector search for the NEXUS pipeline"
requires-python = ">=3.11"
dependencies = [
    "mcp>=0.9",
    "pydantic>=2.5",
    "structlog>=24.1",
    "numpy>=1.26",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.9",
    "ruff>=0.4",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[project.scripts]
nexus-mcp-atlas = "server:main"

[tool.setuptools]
py-modules = ["server", "stix_loader", "vector_search", "schemas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
