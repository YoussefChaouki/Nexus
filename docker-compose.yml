services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-apply pgvector extension + episodic/semantic schemas on first
      # volume init. All migrations use CREATE … IF NOT EXISTS so they're
      # safe to re-apply; existing volumes won't replay them — drop with
      # `docker compose down -v` to force a clean re-init.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override the host-oriented defaults in .env (meant for `make dev`
      # running on the host) with the Docker network's service hostnames —
      # "localhost" inside this container refers to itself, not its
      # postgres/redis siblings.
      REDIS_URL: redis://redis:6379
      POSTGRES_DSN: postgresql+asyncpg://nexus:nexus@postgres:5432/nexus
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-shot ingestion: runs scripts/ingest_patterns.py against the
  # local Postgres to populate the Threat Pattern Library. Gated behind
  # the "setup" profile so a regular `docker compose up` does not pay
  # for OpenAI embedding calls on every boot. Invoke explicitly:
  #     docker compose --profile setup up init
  init:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql+asyncpg://nexus:nexus@postgres:5432/nexus
    command: >
      sh -c "pip install --quiet -e . &&
             python scripts/ingest_patterns.py"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["setup"]

volumes:
  postgres_data:
