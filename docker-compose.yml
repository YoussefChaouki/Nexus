services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-shot ingestion: runs scripts/ingest_patterns.py against the
  # local Postgres to populate the Threat Pattern Library. Gated behind
  # the "setup" profile so a regular `docker compose up` does not pay
  # for OpenAI embedding calls on every boot. Invoke explicitly:
  #     docker compose --profile setup up init
  init:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    command: >
      sh -c "pip install --quiet -e . &&
             python scripts/ingest_patterns.py"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["setup"]

volumes:
  postgres_data:
